# Render's free plan puts a site to sleep after 15 minutes without visitors,
# and the next visitor waits about a minute while it wakes up.
# This pings my three demo sites every 10 minutes during Indian office hours
# on weekdays, when recruiters are most likely to open them.
# Kept to office hours on purpose: Render gives about 750 free hours a month
# per account, and three sites running all day would use them up.
name: Keep demo sites awake

on:
  schedule:
    - cron: "*/10 4-12 * * 1-5"   # every 10 min, 9:30 am to 6:30 pm IST, Mon-Fri
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sites
        run: |
          for url in \
            https://jobguard-fake-job-detector.onrender.com/health \
            https://bhaav-hinglish-sentiment.onrender.com/health \
            https://nutriscan-food-nutrition.onrender.com/health
          do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url" || true)
            echo "$url -> $code"
          done
